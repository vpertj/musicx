name: Release

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0 等 tag 时触发
  workflow_dispatch:  # 也可手动触发

permissions:
  contents: write  # 允许创建 Release 并上传资产

jobs:
  build-macos:
    name: Build & Package macOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags network

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package DMG
        shell: bash
        run: |
          set -e
          APP="build/macos/Build/Products/Release/musicx.app"
          STAGE="${RUNNER_TEMP}/dmg_stage"
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MusicX-${VERSION}.dmg"
          
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          
          hdiutil create \
            -volname "MusicX" \
            -srcfolder "$STAGE" \
            -ov -format UDZO "dist/$DMG_NAME"
          
          echo "DMG_PATH=dist/$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MusicX ${{ github.ref_name }}"
          generate_release_notes: true
          files: "${{ env.DMG_PATH }}"
          fail_on_unmatched_files: true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.DMG_NAME }}"
          path: "${{ env.DMG_PATH }}"
          if-no-files-found: error

      - name: Show checksum
        run: shasum -a 256 "${{ env.DMG_PATH }}"

  build-android:
    name: Build & Package Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/musicx-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=musicx-release.jks\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)"
          PUBSPEC_CODE="$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f2)"
          echo "tag=$TAG_VERSION pubspec=$PUBSPEC_VERSION+$PUBSPEC_CODE"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 pubspec.yaml ($PUBSPEC_VERSION) 不一致。" \
                 "打错 tag 会让发布包文件名带上错误版本号,用户端会看到版本对不上。"
            exit 1
          fi
          if [ -z "$PUBSPEC_CODE" ]; then
            echo "::error::pubspec.yaml 缺少 versionCode(应形如 1.7.42+61)。" \
                 "缺了它安卓无法判断版本高低,升级会被系统拒绝。"
            exit 1
          fi

      - name: Build signed APK
        shell: bash
        run: |
          set -e
          flutter build apk --release
          VERSION="${GITHUB_REF_NAME#v}"
          # 关键:发布包的 versionName/versionCode 必须真的等于本次 tag,
          # 否则会出现「文件名是 v1.7.42、包内却是旧版本」这种最难查的问题。
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)"
          BADGING="$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | head -1)"
          APK_VERSION="$(echo "$BADGING" | sed -E "s/.*versionName='([^']*)'.*/\1/")"
          APK_CODE="$(echo "$BADGING" | sed -E "s/.*versionCode='([^']*)'.*/\1/")"
          echo "APK 实际: versionName=$APK_VERSION versionCode=$APK_CODE"
          if [ "$APK_VERSION" != "$VERSION" ]; then
            echo "::error::构建出的 APK 版本($APK_VERSION)与 tag($VERSION)不一致,拒绝发布。"
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MusicX-${VERSION}.apk"
          echo "APK_PATH=dist/MusicX-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APK_NAME=MusicX-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.APK_PATH }}"
          fail_on_unmatched_files: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.APK_NAME }}"
          path: "${{ env.APK_PATH }}"
          if-no-files-found: error

  build-windows:
    name: Build & Package Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "MusicX-$version-windows.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/$name" -Force
          "ZIP_PATH=dist/$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe 未找到: $iscc" }
          & $iscc "/DAppVersion=$version" "windows/installer/musicx.iss"
          $exe = "dist/MusicX-$version-setup.exe"
          if (-not (Test-Path $exe)) { throw "安装包未生成: $exe" }
          "SETUP_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_NAME=MusicX-$version-setup.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.SETUP_PATH }}
          fail_on_unmatched_files: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musicx-windows
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SETUP_PATH }}
          if-no-files-found: error