name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0 等 tag 时触发
  workflow_dispatch:  # 也可手动触发

permissions:
  contents: write  # 允许创建 Release 并上传资产

jobs:
  build-macos:
    name: Build & Package macOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags network

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package DMG
        shell: bash
        run: |
          set -e
          APP="build/macos/Build/Products/Release/musicx.app"
          STAGE="${RUNNER_TEMP}/dmg_stage"
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="MusicX-${VERSION}.dmg"
          
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          
          hdiutil create \
            -volname "MusicX" \
            -srcfolder "$STAGE" \
            -ov -format UDZO "dist/$DMG_NAME"
          
          echo "DMG_PATH=dist/$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MusicX ${{ github.ref_name }}"
          generate_release_notes: true
          files: "${{ env.DMG_PATH }}"
          fail_on_unmatched_files: true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.DMG_NAME }}"
          path: "${{ env.DMG_PATH }}"
          if-no-files-found: error

      - name: Show checksum
        run: shasum -a 256 "${{ env.DMG_PATH }}"